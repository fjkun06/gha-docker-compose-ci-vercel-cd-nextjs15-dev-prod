name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI Push"] # 👈 depends on CI
    types:
      - completed

jobs:
  vercel-cli-deploy-prod:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache dependencies and Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install Vercel CLI
        run: |
          if [ -f yarn.lock ]; then
            echo "Detected yarn.lock — installing via Yarn..."
            yarn global add vercel@canary
          elif [ -f package-lock.json ]; then
            echo "Detected package-lock.json — installing via npm..."
            npm install --global vercel
          elif [ -f pnpm-lock.yaml ]; then
            echo "Detected pnpm-lock.yaml — installing via pnpm..."
            corepack enable pnpm
            pnpm add -g vercel@canary
          else
            echo "❌ No lockfile found. Aborting."
            exit 1

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
