# ---------------------------------------------
# GitHub Actions Workflow: CI Checks (Lint + Test + Build) for Pushes (merges)
# Purpose: Lint, test and build main or staging branch after a merge
# Triggered automatically on pushes to staging and main branches  
# ---------------------------------------------


name: CI Push

on:
  push:
    branches:
      - xxxx
      - xxxxx
      # - '**' # optional, for all PRs
jobs:
  ci-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache dependencies and Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint || echo "No linters found"

      - name: Run Unit Tests
        run: npm test || echo "No tests found"

      - name: Build Project
        run: npm run build
