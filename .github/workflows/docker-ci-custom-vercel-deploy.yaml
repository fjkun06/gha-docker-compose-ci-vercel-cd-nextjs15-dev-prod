name: Docker CI Development Custom Vercel Deploy

on:
  push:
    branches: [ staging ]  # Run workflow when code is pushed to the staging branch
  pull_request:
    types: [opened, synchronize]
    branches: [ staging ]  # Also run on pull requests targeting staging

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # docker-build-and-push:
