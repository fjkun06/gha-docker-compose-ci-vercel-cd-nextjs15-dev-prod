  #     # --------------------------
  #     - name: Push to Docker Hub
  #       run: docker push fjkun06/basic-app-dev:v1  # Uploads the tested image to Docker Hub for deployment or reuse
        
  vercel-cli-build:
    # needs: docker-build-and-push  # ✅ only run if  succeeds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      # Install Vercel CLI
      - name: Install Vercel CLI
        run: |
          if [ -f yarn.lock ]; then
            echo "Detected yarn.lock — installing via Yarn..."
            yarn global add vercel@canary
          elif [ -f package-lock.json ]; then
            echo "Detected package-lock.json — installing via npm..."
            npm install --global vercel
          elif [ -f pnpm-lock.yaml ]; then
            echo "Detected pnpm-lock.yaml — installing via pnpm..."
            corepack enable pnpm
            pnpm add -g vercel@canary
          else
            echo "❌ No lockfile found. Aborting."
            exit 1
          fi
        working-directory: ./my-app
        
      # Pull Vercel Environment Information
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./my-app

        # Build
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./my-app

        # Upload build artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: ./my-app/.vercel/output
        
  vercel-deploy-preview:
    name: Deploy to preview environment
    needs: [vercel-cli-build]  # ✅ only run if  succeeds
    # needs: [docker-build-and-push, vercel-cli-build]  # ✅ only run if  succeeds
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.seturl.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
         # Download build artifcact
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: ./my-app/.vercel/output/

  # Install Vercel CLI
      - name: Install Vercel CLI
        run: |
          if [ -f yarn.lock ]; then
            echo "Detected yarn.lock — installing via Yarn..."
            yarn global add vercel@canary
          elif [ -f package-lock.json ]; then
            echo "Detected package-lock.json — installing via npm..."
            npm install --global vercel
          elif [ -f pnpm-lock.yaml ]; then
            echo "Detected pnpm-lock.yaml — installing via pnpm..."
            corepack enable pnpm
            pnpm add -g vercel@canary
          else
            echo "❌ No lockfile found. Aborting."
            exit 1
          fi
        working-directory: ./my-app

      # Deploy
      - name: Deploy Project Artifacts to Vercel
        shell: bash
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} | tee deploy.log
        working-directory: ./my-app

      # Set preview url
      - id: seturl
        name: Set preview url
        run: echo "url=$(tail -1 deploy.log)">> $GITHUB_OUTPUT
     
