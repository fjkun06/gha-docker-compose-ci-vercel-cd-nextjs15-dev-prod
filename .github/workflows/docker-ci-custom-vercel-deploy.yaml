# ---------------------------------------------
# GitHub Actions Workflow: Docker CI Pipeline
# Purpose: Build and push Docker images
# Triggered automatically on pushes and PRs to staging branch
# my-app to your app name in github folder
# ---------------------------------------------

name: Docker CI Development Custom Vercel Deploy

on:
  push:
    branches: [ staging ]  # Run workflow when code is pushed to the staging branch
  pull_request:
    types: [opened, synchronize]
    branches: [ staging ]  # Also run on pull requests targeting staging

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest  # Use the latest stable Ubuntu runner environment
    steps:
      # --------------------------
      # Step 1: Check out source code
      # --------------------------
      - name: Checkout repo
        uses: actions/checkout@v5  # Fetch the repository's code so it can be built and tested

      # --------------------------
      # Step 2: Set up Docker Buildx
      # --------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3  # Enables advanced Docker build features (multi-platform builds, caching, etc.)

      # --------------------------
      # Step 3: Authenticate to Docker Hub
      # --------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}  # Securely pulled from repository secrets
          password: ${{ secrets.DOCKERHUB_TOKEN }}     # Used to authenticate and allow image push access

      # --------------------------
      # Step 4: Build the Docker image
      # --------------------------
      # - name: Build Docker image
        # run: docker compose build  # Build image with compose configs for development

      # --------------------------
      # Step 5: Run automated tests inside the container
      # --------------------------
      # - name: Run tests inside container
        # run: docker run myuser/my-app:latest npm test  # Executes the app's test suite within the built container

      # --------------------------
      # Step 6: Push image to Docker Hub
      # --------------------------
      # - name: Push to Docker Hub
        # run: docker push fjkun06/basic-app-dev:v1  # Uploads the tested image to Docker Hub for deployment or reuse
        
  vercel-build:
    runs-on: ubuntu-latest
    outputs:
      build-path: ${{ steps.set-artifact-path.outputs.build-path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable pnpm
            pnpm install --frozen-lockfile
          else
            echo "❌ No lockfile found. Aborting."
            exit 1
          fi

      - name: Install Vercel CLI
        run: |
          if [ -f yarn.lock ]; then
            yarn global add vercel@canary
          elif [ -f package-lock.json ]; then
            npm install -g vercel
          elif [ -f pnpm-lock.yaml ]; then
            pnpm add -g vercel@canary
          fi

      - name: Pull Vercel Environment Variables
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vercel-build
          path: .vercel/output

      - name: Set build path output
        id: set-artifact-path
        run: echo "build-path=.vercel/output" >> $GITHUB_OUTPUT

  # ----------------------------
  # Job 2: Deploy the Vercel project
  # ----------------------------
  vercel-deploy:
    runs-on: ubuntu-latest
    needs: vercel-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: vercel-build
          path: .vercel/output

      - name: Install Vercel CLI
        run: |
          if [ -f yarn.lock ]; then
            yarn global add vercel@canary
          elif [ -f package-lock.json ]; then
            npm install -g vercel
          elif [ -f pnpm-lock.yaml ]; then
            pnpm add -g vercel@canary
          fi

      - name: Deploy to Vercel Preview
        id: deploy
        shell: bash
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --yes

      - name: Output Preview URL
        run: echo "Preview URL: $(tail -1 deploy.log || echo 'URL not captured')"
