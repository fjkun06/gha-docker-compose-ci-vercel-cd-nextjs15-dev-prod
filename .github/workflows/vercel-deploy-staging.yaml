name: Vercel Deploy Staging

on:
  workflow_run:
    workflows: ["Docker CI Development"]  # name of the workflow that builds & pushes Docker
    types:
      - completed
      
  # ----------------------
  # Job 2: Deploy to Vercel
  # ----------------------
jobs:
  vercel-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}  # ✅ only run if  succeeds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: ./my-app

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: vercel --token ${{ secrets.VERCEL_TOKEN }} --cwd ./my-app --confirm
